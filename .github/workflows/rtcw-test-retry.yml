name: RTCW test build, again when no Mac was free

# GitHub has too few Mac machines at busy times. When none comes free,
# the test build's Mac job waits a quarter of an hour, is cancelled
# without having started, and the Windows job and the publishing after
# it never run: the build failed overnight, and the tester woke to no
# new build. This starts that run again by itself, up to five times,
# when - and only when - the Mac job never started. A build that broke
# is left failed, and so is a run cancelled because a newer push
# replaced it.
on:
  workflow_run:
    workflows: ["RTCW test build"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  again:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Run it again if the Mac job never started
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu
          if [ "$ATTEMPT" -ge 6 ]; then
            echo "Tried $ATTEMPT times; leaving it."
            exit 0
          fi

          # Replaced by a newer push on the same branch: that one builds.
          newest=$(gh api "repos/$REPO/actions/workflows/rtcw-test.yml/runs?branch=$BRANCH&per_page=1" \
                     --jq '.workflow_runs[0].id')
          if [ "$newest" != "$RUN" ]; then
            echo "A newer run ($newest) replaced run $RUN; leaving it."
            exit 0
          fi

          # The Mac job cancelled before a single step ran: no machine.
          never=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" --jq '
            [.jobs[] | select(.name | startswith("Build the campaign for the Mac"))
                     | select(.conclusion == "cancelled")
                     | select([.steps[]? | select(.started_at != null)] | length == 0)] | length')
          if [ "$never" = "0" ]; then
            echo "The Mac job started, so this is not a missing machine; leaving it."
            exit 0
          fi

          echo "No Mac machine came free for run $RUN (attempt $ATTEMPT): running it again."
          gh api -X POST "repos/$REPO/actions/runs/$RUN/rerun"
